<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Spotify - Unlimited Full Tracks</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --bg-black: #000000;
      --bg-dark: #121212;
      --bg-card: #181818;
      --bg-card-hover: #282828;
      --spotify-green: #1db954;
      --text-main: #ffffff;
      --text-sub: #b3b3b3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 90px);
      gap: 8px;
      padding: 8px;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background-color: var(--bg-dark);
      border-radius: 8px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .sidebar { display: none; }
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo i {
      color: var(--spotify-green);
      font-size: 28px;
    }

    .nav-links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .nav-links a {
      color: var(--text-sub);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: 0.2s;
    }

    .nav-links a:hover, .nav-links li.active a { color: #fff; }

    .categories {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .cat-btn {
      background: #242424;
      border: none;
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .cat-btn:hover { background: #333; }

    /* Main View */
    .main-view {
      flex: 1;
      background: linear-gradient(to bottom, #202020, var(--bg-dark));
      border-radius: 8px;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .mobile-header {
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .mobile-header i { color: var(--spotify-green); }

    @media (max-width: 768px) {
      .mobile-header { display: flex; }
    }

    .search-bar-wrap {
      display: flex;
      gap: 10px;
      max-width: 550px;
      margin-bottom: 16px;
      width: 100%;
    }

    .search-input-box {
      position: relative;
      flex: 1;
    }

    .search-input-box i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sub);
    }

    .search-input-box input {
      width: 100%;
      padding: 12px 18px 12px 42px;
      border-radius: 50px;
      border: 1px solid transparent;
      outline: none;
      background-color: #242424;
      color: #fff;
      font-size: 14px;
    }

    .search-input-box input:focus {
      border-color: #fff;
      background-color: #2c2c2c;
    }

    .search-btn {
      background-color: var(--spotify-green);
      border: none;
      color: #000;
      font-weight: 700;
      padding: 0 20px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 14px;
    }

    /* Mobile Chips */
    .mobile-chips {
      display: none;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 16px;
      padding-bottom: 4px;
    }

    .mobile-chips::-webkit-scrollbar { display: none; }

    @media (max-width: 768px) {
      .mobile-chips { display: flex; }
    }

    .chip {
      background: #242424;
      border: none;
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    /* Song Grid */
    .song-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 16px;
    }

    @media (max-width: 480px) {
      .song-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
    }

    .song-card {
      background-color: var(--bg-card);
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
      position: relative;
    }

    .song-card:hover {
      background-color: var(--bg-card-hover);
      transform: translateY(-4px);
    }

    .song-card img {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 4px;
      object-fit: cover;
      margin-bottom: 10px;
      background-color: #242424;
    }

    .song-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-artist {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .play-badge {
      position: absolute;
      right: 18px;
      bottom: 56px;
      background-color: var(--spotify-green);
      color: #000;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(6px);
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }

    .song-card:hover .play-badge {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 768px) {
      .play-badge {
        opacity: 1;
        transform: translateY(0);
        width: 32px;
        height: 32px;
        right: 16px;
        bottom: 52px;
      }
    }

    /* Player Bar */
    .player-bar {
      height: 90px;
      background-color: var(--bg-black);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-top: 1px solid #222;
    }

    .track-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 30%;
    }

    .track-meta img {
      width: 52px;
      height: 52px;
      border-radius: 4px;
      object-fit: cover;
      background-color: #242424;
    }

    .meta-text {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .meta-text span:first-child {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.3s;
    }

    .meta-text span:last-child {
      font-size: 11px;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 40%;
    }

    @media (max-width: 768px) {
      .player-center { width: 50%; }
      .track-meta { width: 50%; }
    }

    .control-buttons {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .control-buttons button {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 16px;
      cursor: pointer;
    }

    .control-buttons #playPauseBtn {
      background-color: #ffffff;
      color: #000000;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .timeline-bar {
      width: 100%;
      max-width: 450px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-sub);
    }

    .timeline-bar input[type="range"] {
      flex: 1;
      height: 4px;
      accent-color: var(--spotify-green);
      cursor: pointer;
    }

    .volume-meta {
      width: 25%;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      color: var(--text-sub);
    }

    @media (max-width: 768px) {
      .volume-meta { display: none; }
    }

    .volume-meta input[type="range"] {
      width: 80px;
      accent-color: var(--spotify-green);
      cursor: pointer;
    }

    /* Invisible YouTube Player Container */
    #yt-hidden-player {
      position: absolute;
      width: 1px;
      height: 1px;
      top: -9999px;
      left: -9999px;
      opacity: 0;
      visibility: hidden;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="sidebar">
      <div class="logo">
        <i class="fa-brands fa-spotify"></i> Spotify
      </div>
      <ul class="nav-links">
        <li class="active"><a href="#"><i class="fa-solid fa-house"></i> Home</a></li>
        <li><a href="#"><i class="fa-solid fa-magnifying-glass"></i> Search</a></li>
      </ul>

      <p style="font-size: 11px; color: var(--text-sub); margin-top: 10px; font-weight: 700;">POPULAR GENRES</p>
      <div class="categories">
        <button class="cat-btn" onclick="executeSearch('Bangla Romantic Hits')"><i class="fa-solid fa-music"></i> Bangla Hits</button>
        <button class="cat-btn" onclick="executeSearch('Hindi Bollywood Hits')"><i class="fa-solid fa-music"></i> Hindi Romantic</button>
        <button class="cat-btn" onclick="executeSearch('Arijit Singh Best Songs')"><i class="fa-solid fa-music"></i> Arijit Singh</button>
        <button class="cat-btn" onclick="executeSearch('Shreya Ghoshal Songs')"><i class="fa-solid fa-music"></i> Shreya Ghoshal</button>
      </div>
    </div>

    <div class="main-view">
      <div class="mobile-header">
        <i class="fa-brands fa-spotify"></i> Spotify
      </div>

      <div class="search-bar-wrap">
        <div class="search-input-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" placeholder="Search full song or artist name..." />
        </div>
        <button class="search-btn" id="searchBtn">Search</button>
      </div>

      <div class="mobile-chips">
        <button class="chip" onclick="executeSearch('Bangla Trending')">Bangla Hits</button>
        <button class="chip" onclick="executeSearch('Hindi Romantic')">Hindi Hits</button>
        <button class="chip" onclick="executeSearch('Arijit Singh')">Arijit Singh</button>
        <button class="chip" onclick="executeSearch('Zubeen Garg')">Zubeen Garg</button>
      </div>

      <h2 style="font-size: 18px; margin-bottom: 14px;" id="sectionTitle">Top Full Tracks</h2>
      <div class="song-grid" id="songGrid">
        <p style="color: var(--text-sub);">Finding songs...</p>
      </div>
    </div>
  </div>

  <div class="player-bar">
    <div class="track-meta">
      <img id="playerCover" src="https://via.placeholder.com/52" alt="Cover" />
      <div class="meta-text">
        <span id="playerTitle">No song playing</span>
        <span id="playerArtist">Tap a song to load full audio</span>
      </div>
    </div>

    <div class="player-center">
      <div class="control-buttons">
        <button id="prevBtn"><i class="fa-solid fa-backward-step"></i></button>
        <button id="playPauseBtn"><i class="fa-solid fa-play"></i></button>
        <button id="nextBtn"><i class="fa-solid fa-forward-step"></i></button>
      </div>
      <div class="timeline-bar">
        <span id="currTime">0:00</span>
        <input type="range" id="progressBar" value="0" min="0" max="100" />
        <span id="durTime">0:00</span>
      </div>
    </div>

    <div class="volume-meta">
      <i class="fa-solid fa-volume-high"></i>
      <input type="range" id="volumeBar" min="0" max="100" value="100" />
    </div>
  </div>

  <!-- Hidden YouTube Player Iframe -->
  <div id="yt-hidden-player"></div>

  <!-- Load YouTube Iframe API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const songGrid = document.getElementById("songGrid");
    const searchInput = document.getElementById("searchInput");
    const searchBtn = document.getElementById("searchBtn");
    const sectionTitle = document.getElementById("sectionTitle");

    const playPauseBtn = document.getElementById("playPauseBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const progressBar = document.getElementById("progressBar");
    const volumeBar = document.getElementById("volumeBar");

    const playerCover = document.getElementById("playerCover");
    const playerTitle = document.getElementById("playerTitle");
    const playerArtist = document.getElementById("playerArtist");
    const currTimeEl = document.getElementById("currTime");
    const durTimeEl = document.getElementById("durTime");

    let ytPlayer = null;
    let playlist = [];
    let currentIndex = -1;
    let progressTimer = null;

    // 1. Initialize Hidden YouTube Player
    window.onYouTubeIframeAPIReady = function() {
      ytPlayer = new YT.Player('yt-hidden-player', {
        height: '1',
        width: '1',
        playerVars: {
          'autoplay': 1,
          'controls': 0,
          'disablekb': 1,
          'fs': 0,
          'origin': window.location.origin,
          'playsinline': 1
        },
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    };

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        updatePlayIcon(true);
        playerTitle.style.color = "var(--text-main)";
        startTrackingProgress();
      } else if (event.data === YT.PlayerState.PAUSED) {
        updatePlayIcon(false);
        stopTrackingProgress();
      } else if (event.data === YT.PlayerState.ENDED) {
        nextBtn.click();
      } else if (event.data === YT.PlayerState.BUFFERING) {
        playerTitle.style.color = "var(--spotify-green)";
      }
    }

    // 2. FAST METADATA SEARCH ENGINE (iTunes JSONP - No CORS Blocking)
    function searchSongsJSONP(query) {
      sectionTitle.innerText = `Results for "${query}"`;
      songGrid.innerHTML = `<p style="color: var(--text-sub);">Finding full songs...</p>`;

      const oldScript = document.getElementById('music-jsonp');
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = 'music-jsonp';
      script.src = `https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&entity=song&country=IN&limit=30&callback=handleMusicResponse`;
      document.body.appendChild(script);
    }

    // JSONP Handler
    window.handleMusicResponse = function(data) {
      if (data && data.results && data.results.length > 0) {
        playlist = data.results.map(item => ({
          title: item.trackName,
          artist: item.artistName,
          cover: item.artworkUrl100 ? item.artworkUrl100.replace('100x100bb', '300x300bb') : 'https://via.placeholder.com/150',
          query: `${item.trackName} ${item.artistName} audio` // Important to fetch from YouTube
        }));
        renderGrid(playlist);
      } else {
        songGrid.innerHTML = `<p style="color: var(--text-sub);">No tracks found. Try a different query.</p>`;
      }
    };

    function renderGrid(tracks) {
      songGrid.innerHTML = "";
      tracks.forEach((song, idx) => {
        const card = document.createElement("div");
        card.className = "song-card";
        card.innerHTML = `
          <img src="${song.cover}" alt="${song.title}" loading="lazy" />
          <div class="play-badge"><i class="fa-solid fa-play"></i></div>
          <div class="song-title">${song.title}</div>
          <div class="song-artist">${song.artist}</div>
        `;
        card.addEventListener("click", () => playSong(idx));
        songGrid.appendChild(card);
      });
    }

    // 3. PLAY FULL SONG VIA HIDDEN YOUTUBE PLAYER
    function playSong(idx) {
      if (idx < 0 || idx >= playlist.length || !ytPlayer || !ytPlayer.loadVideoByQuery) {
        // Fallback load via direct search queue
        if (ytPlayer && ytPlayer.loadPlaylist) {
           ytPlayer.loadPlaylist({
             listType: 'search',
             list: playlist[idx].query,
             index: 0
           });
        }
      }

      currentIndex = idx;
      const track = playlist[currentIndex];

      playerTitle.innerText = track.title;
      playerArtist.innerText = track.artist;
      playerCover.src = track.cover;
      
      playerTitle.style.color = "var(--spotify-green)";
      updatePlayIcon(true);

      // This uses YouTube's search parameter to automatically find and play the full audio!
      ytPlayer.loadPlaylist({
        listType: 'search',
        list: track.query,
        index: 0
      });
    }

    // Controls
    function togglePlayback() {
      if (!ytPlayer || !ytPlayer.getPlayerState) return;
      const state = ytPlayer.getPlayerState();
      
      if (state === YT.PlayerState.PLAYING) {
        ytPlayer.pauseVideo();
      } else if (state === YT.PlayerState.PAUSED || state === YT.PlayerState.CUED) {
        ytPlayer.playVideo();
      } else {
        if (playlist.length > 0) playSong(0);
      }
    }

    function updatePlayIcon(isPlaying) {
      playPauseBtn.innerHTML = isPlaying 
        ? '<i class="fa-solid fa-pause"></i>' 
        : '<i class="fa-solid fa-play"></i>';
    }

    function startTrackingProgress() {
      stopTrackingProgress();
      progressTimer = setInterval(() => {
        if (ytPlayer && ytPlayer.getCurrentTime && ytPlayer.getDuration) {
          const curr = ytPlayer.getCurrentTime();
          const dur = ytPlayer.getDuration();
          if (dur > 0) {
            progressBar.value = (curr / dur) * 100;
            currTimeEl.innerText = formatTime(curr);
            durTimeEl.innerText = formatTime(dur);
          }
        }
      }, 500);
    }

    function stopTrackingProgress() {
      if (progressTimer) clearInterval(progressTimer);
    }

    function formatTime(sec) {
      if (isNaN(sec)) return "0:00";
      const min = Math.floor(sec / 60);
      const rem = Math.floor(sec % 60);
      return `${min}:${rem < 10 ? '0' : ''}${rem}`;
    }

    function executeSearch(query) {
      const q = query || searchInput.value.trim();
      if (q !== "") {
        searchSongsJSONP(q);
      }
    }

    // Event Listeners
    playPauseBtn.addEventListener("click", togglePlayback);

    nextBtn.addEventListener("click", () => {
      if (currentIndex + 1 < playlist.length) playSong(currentIndex + 1);
    });

    prevBtn.addEventListener("click", () => {
      if (currentIndex - 1 >= 0) playSong(currentIndex - 1);
    });

    progressBar.addEventListener("input", () => {
      if (ytPlayer && ytPlayer.getDuration) {
        const target = (progressBar.value / 100) * ytPlayer.getDuration();
        ytPlayer.seekTo(target, true);
      }
    });

    volumeBar.addEventListener("input", (e) => {
      if (ytPlayer && ytPlayer.setVolume) {
        ytPlayer.setVolume(e.target.value);
      }
    });

    searchBtn.addEventListener("click", () => executeSearch());
    searchInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") executeSearch();
    });

    // Load initial songs
    setTimeout(() => {
       searchSongsJSONP("Arijit Singh Best Songs");
    }, 500);
  </script>
</body>
</html>
